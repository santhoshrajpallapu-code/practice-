name: CI

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: echo "Build successful"

      - name: Test
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All tests passed"